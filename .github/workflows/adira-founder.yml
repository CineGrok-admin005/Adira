name: ADIRA — Sivaji Founder Post (every ~2 days)

# Runs on GitHub's built-in scheduler every ~2 days. Topic rotates
# deterministically by date in code, so the schedule alone controls cadence.
# Manual posting only (no AUTO_POST). Free-tier scheduled runs can be delayed.
on:
  schedule:
    - cron: '30 5 */2 * *'  # ~every 2 days, 11:00 AM IST (UTC+5:30)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run Sivaji founder post
        run: npx ts-node src/index.ts --run-founder
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACE_API_KEY:        ${{ secrets.HUGGINGFACE_API_KEY }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY:            ${{ secrets.YOUTUBE_API_KEY }}
          NODE_ENV:                   production
          TIMEZONE:                   Asia/Kolkata
