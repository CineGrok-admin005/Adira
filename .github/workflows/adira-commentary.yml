name: ADIRA — Commentary Posts (~12 PM / 8 PM IST)

# Runs on GitHub's built-in scheduler. Note: free-tier scheduled runs can be
# delayed (sometimes by a few hours) during high load — that's a GitHub
# limitation. Scheduling off the :00/:30 mark (GitHub's most congested
# minutes) helps but doesn't guarantee exact timing. workflow_dispatch is
# kept so it can also be triggered by hand or by an external precise-timing
# trigger. The former 4 PM slot now belongs to the Explainer workflow
# (adira-explainer.yml).
on:
  schedule:
    - cron: '37 6 * * *'   # ~12:07 PM IST (UTC+5:30)
    - cron: '37 14 * * *'  # ~8:07 PM IST (UTC+5:30)
  workflow_dispatch:

# hasPostedRecently() alone does NOT stop double-posts: it reads at the top of the run but
# the 'posted' row is only written minutes later, after the LLM call, image generation and
# the LinkedIn upload. Two runs starting inside that window both read zero and both publish —
# which is exactly the 31s and 34s duplicate pairs seen on 2026-07-30 and 2026-07-24.
# This serialises overlapping triggers (delayed schedule stacking on workflow_dispatch), so
# the queued run then finds the first run's row and exits correctly. Both are needed.
concurrency:
  group: adira-commentary
  cancel-in-progress: false   # queue the duplicate; never kill a run mid-post

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run ADIRA commentary
        run: npx ts-node src/index.ts --run-commentary
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACE_API_KEY:        ${{ secrets.HUGGINGFACE_API_KEY }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN:      ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:         ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_ORGANIZATION_ID:   ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_TOKEN_EXPIRES_AT:  ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          TWITTER_API_KEY:            ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:         ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:       ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET:      ${{ secrets.TWITTER_ACCESS_SECRET }}
          YOUTUBE_API_KEY:            ${{ secrets.YOUTUBE_API_KEY }}
          NEWSDATA_API_KEY:           ${{ secrets.NEWSDATA_API_KEY }}
          TWITTER_ENABLED:            'false'
          AUTO_POST:                  'true'
          NODE_ENV:                   production
          TIMEZONE:                   Asia/Kolkata
