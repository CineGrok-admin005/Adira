name: ADIRA — Explainer Post (~4 PM IST)

# Runs on GitHub's built-in scheduler. Note: free-tier scheduled runs can be
# delayed (sometimes by a few hours) during high load — that's a GitHub
# limitation. Scheduling off the :00/:30 mark (GitHub's most congested
# minutes) helps but doesn't guarantee exact timing. workflow_dispatch is
# kept so it can also be triggered by hand or by an external precise-timing
# trigger.
on:
  schedule:
    - cron: '37 10 * * *'  # ~4:07 PM IST (UTC+5:30)
  workflow_dispatch:

# See adira-commentary.yml for the full rationale: the in-code duplicate guard reads at the
# start of a run but writes minutes later, so overlapping triggers must be serialised here.
concurrency:
  group: adira-explainer
  cancel-in-progress: false   # queue the duplicate; never kill a run mid-post

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run ADIRA explainer post
        run: npx ts-node src/index.ts --run-explainer
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACE_API_KEY:        ${{ secrets.HUGGINGFACE_API_KEY }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN:      ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:         ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_ORGANIZATION_ID:   ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_TOKEN_EXPIRES_AT:  ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          AUTO_POST:                  'true'
          NODE_ENV:                   production
          TIMEZONE:                   Asia/Kolkata
